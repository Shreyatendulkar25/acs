<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        main { padding: 2rem; background: #f4f4f4; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; }
        h1, h2 { color: #333; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .gallery img { width: 100%; height: auto; border-radius: 8px; }
    </style>
</head>
<body>

    <header><h1>gallery</h1></header>

    <main>

        <section>
            <h2>Git Gallery</h2>
            <div class="gallery">
                <img src="https://wallup.net/wp-content/uploads/2016/03/10/318375-nature-landscape-lake-mountain-forest-wildflowers-spring-pine_trees-path-Switzerland-HDR.jpg" class="rounded float-start" alt="nature">
                <img src="https://wallup.net/wp-content/uploads/2016/03/10/318375-nature-landscape-lake-mountain-forest-wildflowers-spring-pine_trees-path-Switzerland-HDR.jpg" class="rounded float-start" alt="nature">

            </div>
        </section>
    </main>

    <footer>&copy; 2025 Your Company</footer>

</body>
</html>
