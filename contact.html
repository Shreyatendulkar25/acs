<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        main { padding: 2rem; background: #f4f4f4; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; }
        h1, h2 { color: #333; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin: 5px 0; }
        .contact-section { margin-top: 2rem; }
        .contact-section a { color: #0077b5; text-decoration: none; }
        .contact-section a:hover { text-decoration: underline; }
        @media (max-width: 768px) { main { padding: 1rem; } }
    </style>
</head>
<body>

    <header>
        <h1>contact</h1>
    </header>

    <main>
       

        <section class="contact-section">
            <h2>Contact for Git Support</h2>
            <p>If you have questions or need further information about Git, feel free to reach out:</p>
            <p>Email: <a href="mailto:support@git.com">support@git.com</a></p>
            <p>For additional resources, visit the <a href="https://git-scm.com/" target="_blank">official Git website</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Your Company</p>
    </footer>

</body>
</html>
